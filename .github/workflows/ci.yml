# 최소 CI. 이 앱은 main 브랜치가 곧 설치 소스(uv tool install git+…, install.sh)라서
# 사용자가 받는 경로 그대로 "휠 빌드 → 폰트 포함 확인 → 새 가상환경 설치 → 헤드리스 import"를 검증한다.
# main 보호 룰셋이 이 잡(verify)을 머지 조건으로 요구한다.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (기본 규칙)
        run: uvx ruff@0.14.0 check .
      - name: Qt 헤드리스 런타임 라이브러리
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: 휠 빌드 · 폰트 포함 확인
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -E 'playlist_to_mp3/fonts/.+\.ttf' || { echo "::error::휠에 폰트가 없습니다(pyproject force-include 확인)"; exit 1; }
      - name: 새 가상환경에 휠 설치 후 import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv venv /tmp/venv --python 3.12
          uv pip install --python /tmp/venv/bin/python dist/*.whl
          /tmp/venv/bin/python -c "import playlist_to_mp3.app as a, playlist_to_mp3.ffmpeg_setup; assert callable(a.main); print('import ok')"
          test -x /tmp/venv/bin/playlist-to-mp3
